/**:
  ros__parameters:
    parameters_path_postfix: "parameters/"
    node_parameters_path_postfix: "node_parameters/"
    default_parameter_file: "parameters.yaml"
    use_sim_time: true

sensor:
  usb_cam:
    ros__parameters:
      video_device: "/dev/video0"
      framerate: 10.0
      io_method: "mmap"
      frame_id: "camera"
      pixel_format: "yuyv"
      image_width: 640
      image_height: 480
      camera_name: "test_camera"
      camera_info_url: "package://usb_cam/config/camera_info.yaml"