      min: 100
      max: 5000
      constant: false
      description: Producer acknowledgement deadline and DDS reference lifespan.
    reference_callback_provider_publish_period_ms:
      type: int
      value: 100
      min: 10
      max: 2000
      constant: true
    maneuver_completion_token_acquisition_timeout_s:
      type: float
