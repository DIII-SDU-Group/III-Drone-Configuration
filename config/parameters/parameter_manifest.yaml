perception:
  begin_running:
    type: bool
    value: false
    constant: true
  processing_stack:
    type: string
    value: legacy
    options:
    - legacy
    - powerline_slam
    constant: true
    description: Perception processing stack the canonical system profile instantiates at boot (static for a booted session; no hot switching). legacy runs hough_transformer, pl_dir_computer and pl_mapper; powerline_slam runs the separate powerline_slam lifecycle node instead and is valid only for the sim runtime profile with /tf/sim/sensor_layout d4s_dc_drone_powerline_eval.
  powerline_slam:
    runtime_config:
      type: string
      value: none
      constant: true
      description: Path of the powerline_slam node's runtime configuration (iii.powerline-slam-runtime-config/v1 JSON naming the calibration set, map and mission priors, gyro covariance and estimator contracts); none leaves the node unconfigurable.
  hough_transformer:
    canny_low_threshold:
      type: int
      value: 50
    canny_ratio:
      type: int
      value: 4
    canny_kernel_size:
      type: int
      value: 3
    n_lines_include:
      type: int
      value: 8
    image_transport:
      type: string
      value: raw
      options:
      - raw
      - compressed
      constant: true
      description: Cable camera image transport. compressed (lossless PNG) where frames cross a network link (the simulated camera in SIM and HIL); raw for the on-board camera.
  pl_dir_computer:
    kf_r:
      type: float
      value: 0.999
    kf_q:
      type: float
      value: 0.001
    odometry_callback_period_ms:
      type: int
      value: 25
      constant: true
  pl_mapper:
    kf_r:
      type: float
      value: 0.999
      min: 0
      max: 1
    kf_q:
      type: float
      value: 0.001
      min: 0
      max: 1
    alive_cnt_low_thresh:
      type: int
      value: 0
      min: 0
      max: /perception/pl_mapper/alive_cnt_high_thresh-1
    alive_cnt_high_thresh:
      type: int
      value: 60
      min: /perception/pl_mapper/alive_cnt_low_thresh+1
      max: /perception/pl_mapper/alive_cnt_ceiling-1
    alive_cnt_ceiling:
      type: int
      value: 150
      min: /perception/pl_mapper/alive_cnt_high_thresh+1
    min_point_dist:
      type: float
      value: 0.5
      min: 0.05
      max: 2.0
    max_point_dist:
      type: float
      value: 20.0
      min: 10.0
    view_cone_slope:
      type: float
      value: 0.85
      min: 0.0
    strict_min_point_dist:
      type: float
      value: 1.0
      min: /perception/pl_mapper/min_point_dist
      max: /perception/pl_mapper/strict_max_point_dist-0.1
    strict_max_point_dist:
      type: float
      value: 18.0
      min: /perception/pl_mapper/strict_min_point_dist+0.1
      max: /perception/pl_mapper/max_point_dist
    strict_view_cone_slope:
      type: float
      value: 0.9
      min: /perception/pl_mapper/view_cone_slope
      max: 2.0
    matching_line_max_dist:
      type: float
      value: 3.0
      min: 0.1
    predict_callback_period_ms:
      type: int
      value: 25
      min: 5
      constant: true
    max_lines:
      type: int
      value: 10
      min: 1
      max: 20
    use_inter_line_positions:
      type: bool
      value: true
    inter_pos_window_size:
      type: int
      value: 5
      min: 1
      max: 100
    overwrite_non_FOV_line_positions_from_inter_pos:
      type: bool
      value: true
      constant: false
