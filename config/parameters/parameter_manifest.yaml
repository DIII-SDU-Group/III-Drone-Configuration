      type: float
      value: 0.1
      min: 0.0
      max: 5.0
    hover_on_cable_default_yaw_rate:
      type: float
      value: 0.0
      min: -3.1415
      max: 3.1415
    cable_push_takeoff_request_acceleration:
      type: float
      value: 0.2
      min: 0.05
      max: 1.0
      constant: true
      description: Upward acceleration (m/s^2) the cable push commands until PX4 applies it (airborne and commanding thrust); it only has to be upward so PX4 leaves its takeoff state machine.
    cable_push_jerk:
      type: float
      value: 1.0
      min: 0.2
      max: 3.0
      constant: true
      description: Ramp rate (m/s^3) of the cable push acceleration while PX4 applies the push.
    cable_push_start_timeout_s:
      type: float
      value: 8.0
      min: 3.0
      max: 30.0
      constant: true
      description: Time (s) within which PX4 must apply the cable push (report the vehicle airborne and command thrust) after it starts; otherwise the push fails and the vehicle stays on the cable.
    cable_push_thrust_over_hover:
      type: float
      value: 1.3
      min: 1.05
      max: 1.8
      constant: true
      description: Cable push thrust as a multiple of the hover thrust measured in free flight before the cable landing; the push acceleration is sized from it and the hover thrust PX4 assumes, so an untuned MPC_THR_HOVER does not change the push force.
    cable_push_max_thrust:
      type: float
      value: 0.95
      min: 0.5
      max: 1.0
      constant: true
      description: Normalized thrust the calibrated cable push never commands above (below PX4's thrust saturation).
    maneuver_wait_for_execute_poll_ms:
      type: int
      value: 100
      min: 10
      max: /control/maneuver_controller/maneuver_start_timeout_s*1000
      constant: true
    maneuver_evaluate_done_poll_ms:
